<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SysML ブラウザ</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">SysML ブラウザ</div>
  <button id="files-button" type="button" title="表示するファイルを選ぶ" hidden>ファイル</button>
  <div class="nav">
    <button id="back" type="button" title="戻る（Alt+←）" aria-label="戻る">←</button>
    <button id="forward" type="button" title="進む（Alt+→）" aria-label="進む">→</button>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="検索（例：type:PartUsage wheel）　/ で移動" autocomplete="off"
           spellcheck="false" aria-label="検索">
    <button id="help-button" type="button" aria-expanded="false">書き方</button>
    <div id="help" class="popover" hidden></div>
  </div>
  <div class="right">
    <span id="status"></span>
    <button id="lang-button" type="button" hidden></button>
    <button id="issues-button" type="button"></button>
    <button id="reload" type="button" title="ファイルを読み込み直す">再読み込み</button>
  </div>
</header>
<main>
  <aside id="sidebar">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="types" aria-selected="true">種類</button>
      <button type="button" role="tab" data-tab="tree" aria-selected="false">ツリー</button>
    </div>
    <div id="types" class="pane"></div>
    <div id="tree" class="pane" hidden></div>
  </aside>
  <section id="list" aria-label="一覧"></section>
  <section id="detail" aria-label="詳細"></section>
</main>
<dialog id="files-dialog" aria-labelledby="files-title">
  <div class="dialog-head">
    <h2 id="files-title">表示するファイル</h2>
    <button type="button" id="files-close" aria-label="閉じる">×</button>
  </div>
  <p class="dialog-note">ファイル名をクリックするとそのファイルだけを、「フォルダごと開く」でフォルダの中のファイルをまとめて開きます（互いに参照するファイルは、まとめて開いてください）。</p>
  <input id="files-filter" type="search" placeholder="ファイル名で絞り込む" aria-label="ファイル名で絞り込む">
  <div id="files-status" class="dialog-note" role="status"></div>
  <div id="files-list"></div>
</dialog>
<script src="app.js"></script>
</body>
</html>
