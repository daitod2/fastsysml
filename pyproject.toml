[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsysml"
version = "0.1.0"
description = "Fast SysML v2 / KerML parsing and name resolution from Python, using an improved SysML v2 Pilot Implementation in a long-lived JVM"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "EPL-2.0" }
authors = [{ name = "daitod2" }]
keywords = ["SysML", "SysML v2", "KerML", "MBSE", "parser"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Java",
    "License :: OSI Approved :: Eclipse Public License 2.0 (EPL-2.0)",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Compilers",
]
# To get the runtime files on first use: zstandard to extract the conda package, certifi as a fallback CA bundle.
dependencies = ["zstandard>=0.21", "certifi"]

[project.urls]
Repository = "https://github.com/daitod2/fastsysml"

[project.scripts]
fastsysml = "fastsysml.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastsysml = ["java/**/*.class", "browser/static/*", "browser/translations/**/*.json"]
